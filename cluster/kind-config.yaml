# OWASP Kubernetes Top 10 (2025) - cluster definition
---
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

networking:
  # K06
  apiServerAddress: "127.0.0.1"
  # K05
  disableDefaultCNI: true
  # K06, K07
  kubeProxyMode: "none"

nodes:
- role: control-plane
  # K07
  image: kindest/node:v1.37.0
  kubeadmConfigPatches:
  - |
    apiVersion: kubeadm.k8s.io/v1beta4
    kind: ClusterConfiguration
    apiServer:
      extraArgs:
      # K10
      - name: audit-policy-file
        value: /etc/kubernetes/policies/audit-policy.yaml
      - name: audit-log-path
        value: /var/log/kubernetes/kube-apiserver-audit.log
      - name: audit-log-mode
        value: batch
      - name: audit-log-maxage
        value: "30"
      - name: audit-log-maxbackup
        value: "10"
      - name: audit-log-maxsize
        value: "100"
      # K03
      - name: encryption-provider-config
        value: /etc/kubernetes/enc/encryption-config.yaml
      - name: encryption-provider-config-automatic-reload
        value: "true"
      # K09
      - name: authentication-config
        value: /etc/kubernetes/auth/authentication-config.yaml
      - name: service-account-lookup
        value: "true"
      - name: service-account-extend-token-expiration
        value: "false"
      # K02, K07
      - name: authorization-mode
        value: "Node,RBAC"
      - name: enable-admission-plugins
        value: "NodeRestriction"
      # K07
      - name: profiling
        value: "false"
      - name: tls-min-version
        value: VersionTLS12
      - name: request-timeout
        value: 60s
      extraVolumes:
      - name: encryption-config
        hostPath: /etc/kubernetes/enc
        mountPath: /etc/kubernetes/enc
        readOnly: true
        pathType: DirectoryOrCreate
      - name: audit-policies
        hostPath: /etc/kubernetes/policies
        mountPath: /etc/kubernetes/policies
        readOnly: true
        pathType: DirectoryOrCreate
      - name: authentication-config
        hostPath: /etc/kubernetes/auth
        mountPath: /etc/kubernetes/auth
        readOnly: true
        pathType: DirectoryOrCreate
      - name: audit-logs
        hostPath: /var/log/kubernetes
        mountPath: /var/log/kubernetes
        readOnly: false
        pathType: DirectoryOrCreate
    controllerManager:
      extraArgs:
      # K07
      - name: profiling
        value: "false"
      # K02
      - name: use-service-account-credentials
        value: "true"
      - name: terminated-pod-gc-threshold
        value: "10"
      # K06
      - name: bind-address
        value: 127.0.0.1
    scheduler:
      extraArgs:
      # K07
      - name: profiling
        value: "false"
      # K06
      - name: bind-address
        value: 127.0.0.1
    etcd:
      local:
        extraArgs:
        # K06, K07
        - name: auto-tls
          value: "false"
        - name: peer-auto-tls
          value: "false"
  - |
    kind: KubeletConfiguration
    # K06
    readOnlyPort: 0
    # K09
    authentication:
      anonymous:
        enabled: false
      webhook:
        enabled: true
    # K02
    authorization:
      mode: Webhook
    # K06
    streamingConnectionIdleTimeout: 5m
    # K07
    tlsMinVersion: VersionTLS12
  extraMounts:
  # K03
  - hostPath: ./cluster/encryption-config.yaml
    containerPath: /etc/kubernetes/enc/encryption-config.yaml
    readOnly: true
  # K10
  - hostPath: ./cluster/audit-policy.yaml
    containerPath: /etc/kubernetes/policies/audit-policy.yaml
    readOnly: true
  # K09
  - hostPath: ./cluster/authentication-config.yaml
    containerPath: /etc/kubernetes/auth/authentication-config.yaml
    readOnly: true

- role: worker
  image: kindest/node:v1.37.0
  kubeadmConfigPatches:
  - |
    kind: KubeletConfiguration
    # K06
    readOnlyPort: 0
    # K09
    authentication:
      anonymous:
        enabled: false
      webhook:
        enabled: true
    # K02
    authorization:
      mode: Webhook
    # K06
    streamingConnectionIdleTimeout: 5m
    # K07
    tlsMinVersion: VersionTLS12

- role: worker
  image: kindest/node:v1.37.0
  kubeadmConfigPatches:
  - |
    kind: KubeletConfiguration
    # K06
    readOnlyPort: 0
    # K09
    authentication:
      anonymous:
        enabled: false
      webhook:
        enabled: true
    # K02
    authorization:
      mode: Webhook
    # K06
    streamingConnectionIdleTimeout: 5m
    # K07
    tlsMinVersion: VersionTLS12
