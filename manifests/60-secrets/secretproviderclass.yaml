# K03: Secrets Management Failures
---
# K03: the credential is mounted as a file; no Kubernetes Secret is created.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: deathstar-openbao
  namespace: star-wars
spec:
  provider: openbao
  parameters:
    openbaoAddress: "http://openbao.openbao.svc.cluster.local:8200"
    openbaoKubernetesMountPath: "kubernetes"
    roleName: "deathstar"
    # K09
    audience: "openbao"
    objects: |
      - objectName: "access-code"
        secretPath: "secret/data/star-wars/deathstar"
        secretKey: "access-code"
