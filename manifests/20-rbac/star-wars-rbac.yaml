# K02: Overly Permissive Authorization Configurations
---
# K09
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deathstar
  namespace: star-wars
automountServiceAccountToken: false
---
# K09
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tiefighter
  namespace: star-wars
automountServiceAccountToken: false
---
# K09
apiVersion: v1
kind: ServiceAccount
metadata:
  name: xwing
  namespace: star-wars
automountServiceAccountToken: false
---
# K02: no wildcards, no escalate/bind/impersonate, no nodes/proxy,
# no list/watch on secrets, no pods/exec.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: star-wars-operator
  namespace: star-wars
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
# K02
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: star-wars-operator
  namespace: star-wars
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: star-wars-operator
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: star-wars-operators
